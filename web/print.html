<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>术前绘本 · 打印</title>
<meta name="robots" content="noindex" />
<!-- 与 index.html 同一套样式：书页结构（css/book.css）是唯一真相 -->
<link rel="stylesheet" href="css/fonts-zcool.css" />
<link rel="stylesheet" href="css/fabric.css" />
<link rel="stylesheet" href="css/book.css" />
<style>
  /* 屏幕上这本是"隐性"的（#print-root 在屏幕外），只留一个提示条，
     免得打开页面的人以为坏了。打印时 body 的其它节点全被 book.css 隐藏。 */
  .print-boot {
    position: fixed;
    inset: auto 0 0 0;
    padding: 10px 16px;
    font: 12px/1.6 system-ui, "Microsoft YaHei", sans-serif;
    color: #5a4636;
    background: #fdf4e3;
    border-top: 1px dashed rgba(150, 112, 74, .35);
  }
  .print-boot b { color: #3f7a60; }
</style>
</head>
<body>
  <div id="print-root" aria-hidden="true"></div>

  <div class="print-boot">
    <b>打印页</b> · 每张书页 430 × 560（@page）。直接 Ctrl+P / 由 MCP 的
    <code>render_pdf</code> 调 headless Chrome 落 PDF。页面加载完成后
    <code>&lt;html data-print-ready="1"&gt;</code>。
  </div>

  <script type="module">
    import { mountPrint } from './print-render.mjs';
    mountPrint();
  </script>
</body>
</html>
